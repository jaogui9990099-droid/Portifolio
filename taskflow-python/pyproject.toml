[project]
name = "taskflow"
version = "1.0.0"
description = "Local task automation CLI with JSON persistence"
requires-python = ">=3.11"
authors = [{ name = "Nextstars" }]

[project.scripts]
taskflow = "taskflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
